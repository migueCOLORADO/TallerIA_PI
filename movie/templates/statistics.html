{% extends "movie/base.html" %}
{% block title %}Statistics{% endblock %}
{% block content %}
<div class="container py-4">
    <h1 class="mb-4" style="color: var(--text-light);">Statistics</h1>
    <h3 style="color: var(--text-light);">Películas por año</h3>
    <img src="data:image/png;base64,{{ graphic }}" alt="Gráfica de películas por año" class="img-fluid mb-4">
    <h3 style="color: var(--text-light);">Películas por género</h3>
    <img src="data:image/png;base64,{{ graphic_genre }}" alt="Gráfica de películas por género" class="img-fluid">
</div>
{% endblock %}
