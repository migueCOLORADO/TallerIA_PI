{% extends "movie/base.html" %}
{% block title %}Statistics{% endblock %}
{% block content %}
<div class="container py-4">
    <h1 class="mb-4" style="color: var(--text-light);">Statistics</h1>
    <h3 style="color: var(--text-light);">Movies per year chart</h3>
    <img src="data:image/png;base64,{{ graphic }}" alt="Movies per year chart" class="img-fluid mb-4">
    <h3 style="color: var(--text-light);">Movies per genre chart</h3>
    <img src="data:image/png;base64,{{ graphic_genre }}" alt="Movies per genre chart" class="img-fluid">
</div>
{% endblock %}
